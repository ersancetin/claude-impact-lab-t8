name: GitHub Pages

on:
  push:
    branches:
      - main            # yalnizca varsayilan dal; bkz. asagidaki dal politikasi notu
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # AI Sohbet (DeepSeek) anahtarini SADECE bu calistiricinin
      # gecici kopyasina gomer, repoya asla geri yazilmaz. Secret
      # tanimli degilse dosya bos anahtarla kalir ve AI Sohbet
      # widget'i "yapilandirilmamis" mesaji gosterir (crash etmez).
      #
      # GUVENLIK NOTU: site tamamen statik oldugu icin anahtar yine
      # de yayinlanan sayfanin kaynaginda herkese acik olur. Bu
      # bilinen ve kabul edilen bir demo/hackathon riskidir; dusuk
      # harcama limitli bir anahtar kullanin. Kalici kullanim icin
      # anahtari gizleyen bir proxy (ör. Cloudflare Worker) gerekir.
      - name: DeepSeek anahtarini goem (yalnizca yayin derlemesi)
        if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          yol = pathlib.Path("docs/assets/ai-yapilandirma.js")
          metin = yol.read_text(encoding="utf-8")
          anahtar = os.environ["DEEPSEEK_API_KEY"]
          metin = metin.replace('apiAnahtar: "",', f'apiAnahtar: "{anahtar}",')
          yol.write_text(metin, encoding="utf-8")
          PY

      # Pages bu depoda acildi (Settings > Pages > Source: GitHub Actions).
      # enablement kaldirildi: Actions token'i Pages sitesini OLUSTURAMIYOR
      # ("Resource not accessible by integration"), yalnizca mevcut siteye
      # dagitim yapabiliyor. Site zaten acik oldugu icin bayraga gerek yok.
      #
      # DIKKAT - iki ayri engel var, ikisi de sessizce sonuc verir:
      #  1) Tetikleyici dal listesi: burada olmayan bir dala push edilirse
      #     is akisi hic calismaz.
      #  2) github-pages ortaminin dagitim dali politikasi: varsayilan olarak
      #     yalnizca varsayilan dal dagitim yapabilir. Baska bir daldan
      #     calistirilirsa is birkac saniyede "environment protection rules"
      #     hatasiyla duser. Cozum: Settings > Environments > github-pages >
      #     Deployment branches listesine ilgili dal eklenmelidir.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: dagit
        uses: actions/deploy-pages@v4
