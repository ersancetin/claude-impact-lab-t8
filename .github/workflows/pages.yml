name: GitHub Pages

on:
  push:
    branches: [claude/stk-platform-corporate-design-aa1wlm]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages 2026-08-15'te acildi ve Source: GitHub Actions secili.
      # Tetikleyici dal, uzerinde calisilan dalla ayni olmalidir; aksi halde
      # is akisi hic calismaz ve site sessizce eski surumde kalir.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: dagit
        uses: actions/deploy-pages@v4
