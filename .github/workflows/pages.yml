name: GitHub Pages

on:
  push:
    branches:
      - claude/stk-platform-corporate-design-aa1wlm   # guncel calisma dali
      - claude/earthquake-logistics-system-68e5sz     # varsayilan dal
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages acik ve Source: GitHub Actions secili.
      #
      # DIKKAT - iki ayri engel var, ikisi de sessizce sonuc verir:
      #  1) Tetikleyici dal listesi: burada olmayan bir dala push edilirse
      #     is akisi hic calismaz.
      #  2) github-pages ortaminin dagitim dali politikasi: varsayilan olarak
      #     yalnizca varsayilan dal dagitim yapabilir. Baska bir daldan
      #     calistirilirsa is birkac saniyede "environment protection rules"
      #     hatasiyla duser. Cozum: Settings > Environments > github-pages >
      #     Deployment branches listesine ilgili dal eklenmelidir.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: dagit
        uses: actions/deploy-pages@v4
